<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - Arom UI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F46E5">
<link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">



<style id="detail-precision-fix">
/* Gambar dan panel kanan harus dimulai pada garis atas card yang sama. */
.detail-container {
    align-items: stretch !important;
}
.detail-container .detail-img {
    align-self: stretch !important;
    padding: 0 !important;
    margin: 0 !important;
    display: flex !important;
    align-items: flex-start !important;
    justify-content: center !important;
}
.detail-container .detail-img img {
    display: block !important;
    width: 100% !important;
    height: auto !important;
    max-width: 100% !important;
    max-height: none !important;
    object-fit: contain !important;
    object-position: top center !important;
    margin: 0 !important;
    border-radius: 0 !important;
}
.detail-container .detail-info {
    align-self: stretch !important;
    margin: 0 !important;
}
@media (max-width: 768px) {
    .detail-container .detail-img {
        min-height: 0 !important;
    }
}
</style>
</head>
<body data-page="detail">

    <nav class="navbar">
    <a href="index.html" class="logo-center">
        <span style="font-size:1.8rem;font-weight:800;color:var(--primary);letter-spacing:-1px;">Arom UI</span>
    </a>
    <button class="hamburger" id="hamburger" aria-label="Menu">
        <i class="fas fa-bars"></i>
    </button>
    <div class="nav-right" id="nav-menu">
        <a href="index.html" class="nav-item">Home</a>
        <a href="products.html" class="nav-item">Katalog</a>
        <a href="tentang.html" class="nav-item">Tentang</a>
        <a href="kontak.html" class="btn-nav">Hubungi Kami</a>
    </div>
</nav>

    <section class="section">
        <div class="detail-container" id="product-detail-container">
            <div class="detail-img">
                <img id="detail-image" src="" alt="Preview Template">
            </div>
            <div class="detail-info">
                <span id="detail-category" class="detail-category">Kategori</span>
                <h1 id="detail-name">Nama Produk</h1>
                <div id="detail-price" class="detail-price">Rp 0</div>
                <p id="detail-desc" class="detail-desc">Deskripsi produk...</p>
                
                <h3>Fitur Template:</h3>
                <ul id="detail-features" class="features-list"></ul>

                <h3>Teknologi:</h3>
                <div id="detail-tech" class="tech-stack"></div>

                <div class="action-btns">
                    <button id="btn-order" class="btn btn-wa"><i class="fab fa-whatsapp"></i> Pesan via WhatsApp</button>
                    <a id="demo-link" href="#" target="_blank" class="btn btn-outline"><i class="fas fa-desktop"></i> Live Demo</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <h3>Arom UI</h3>
            <p>Premium website template untuk kebutuhan bisnis, portfolio, dan online store.</p>
            <p>&copy; 2026 Arom UI Marketplace. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

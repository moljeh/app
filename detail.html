<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - LuminaUI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="detail">

    <nav class="navbar">
        <a href="index.html" class="logo">LuminaUI</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Produk</a>
            <a href="products.html">Kategori</a>
            <a href="#">Tentang</a>
            <a href="#">Kontak</a>
        </div>
    </nav>

    <section class="section">
        <div class="detail-container" id="product-detail-container">
            <div class="detail-img">
                <img id="detail-image" src="" alt="Preview Template">
            </div>
            <div class="detail-info">
                <span id="detail-category" class="detail-category">Kategori</span>
                <h1 id="detail-name">Nama Produk</h1>
                <div id="detail-price" class="detail-price">Rp 0</div>
                <p id="detail-desc" class="detail-desc">Deskripsi produk...</p>
                
                <h3>Fitur Template:</h3>
                <ul id="detail-features" class="features-list"></ul>

                <h3>Teknologi:</h3>
                <div id="detail-tech" class="tech-stack"></div>

                <div class="action-btns">
                    <button id="btn-order" class="btn btn-wa"><i class="fab fa-whatsapp"></i> Pesan via WhatsApp</button>
                    <a id="demo-link" href="#" target="_blank" class="btn btn-outline"><i class="fas fa-desktop"></i> Live Demo</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 LuminaUI Marketplace. All rights reserved.</p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

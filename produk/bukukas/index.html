<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Buku Kas Pribadi</title>
  
  <!-- ========================================== -->
  <!-- 1. FAVICON (Ikon Tab Browser)              -->
  <!-- ========================================== -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- ========================================== -->
  <!-- 2. META TAGS (Untuk WhatsApp & Sosmed)     -->
  <!-- ========================================== -->
  
  <link rel="manifest" href="manifest.json">
  
  <meta property="og:title" content="Buku Kas Pribadi">
  <meta property="og:description" content="Aplikasi pintar untuk mencatat arus kas, pemasukan, dan pengeluaran harian secara mudah dan rapi.">
  <meta property="og:type" content="website">
  
  <!-- PENTING: WhatsApp mewajibkan link gambar menggunakan URL absolut (https://...) -->
  <!-- Ganti link di bawah ini dengan URL domain hosting/Github Pages asli Anda -->
  <meta property="og:image" content="https://moljeh.github.io/uangpribadi/logo.png">
  <meta property="og:url" content="https://moljeh.github.io/tahun/">
  
  
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { primary: '#2563eb', secondary: '#475569', light: '#f8fafc' } 
        } 
      }
    }
  </script>
  
  <style>
    body { background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
    .mobile-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); position: relative; }
    .app-container { padding-bottom: 80px; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="text-slate-800 antialiased font-sans">


<!-- BANNER INSTALL PWA -->
  <div id="install-banner" class="hidden fixed top-4 left-1/2 -translate-x-1/2 w-[90%] max-w-[400px] bg-white rounded-2xl shadow-2xl border border-blue-100 p-4 z-[100] flex items-center justify-between transition-all duration-500 transform -translate-y-20 opacity-0">
    <div class="flex items-center gap-3">
      <img src="logo.png" alt="Logo" class="w-10 h-10 rounded-xl shadow-sm border border-slate-100">
      <div>
        <h4 class="text-sm font-bold text-slate-800 leading-tight">Install Buku Kas</h4>
        <p class="text-[10px] text-slate-500 mt-0.5">Pasang di layar utama HP Anda.</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button id="btn-tutup-install" class="text-[10px] font-bold text-slate-400 hover:text-slate-600 px-2 py-2">Nanti</button>
      <button id="btn-install" class="bg-primary text-white text-[11px] font-bold py-2 px-4 rounded-xl shadow-md hover:bg-blue-700 transition-colors">Install</button>
    </div>
  </div>

  <!-- LAYAR LOGIN -->
  <div id="login-screen" class="mobile-container flex flex-col justify-center px-8 hidden">
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-blue-50 text-primary rounded-full flex items-center justify-center mx-auto mb-4 text-3xl border border-blue-100 shadow-sm">
        <i class="fas fa-lock"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-800">Selamat Datang</h2>
      <p class="text-xs text-slate-500 mt-1">Silakan masuk ke Buku Kas Anda</p>
    </div>
    
<div class="mb-4">
      <label class="block text-[11px] font-bold mb-1.5 text-slate-500 uppercase">Username</label>
      <!-- Tambahkan autocomplete="off" -->
      <input type="text" id="inputUser" autocomplete="off" class="w-full border border-slate-200 rounded-xl p-3.5 bg-light outline-none focus:border-primary transition" placeholder="Masukkan username">
    </div>
    
    <div class="mb-8">
      <label class="block text-[11px] font-bold mb-1.5 text-slate-500 uppercase">Password</label>
      <div class="relative">
        <!-- Tambahkan autocomplete="new-password" dan padding kanan (pr-12) agar teks tidak tertimpa ikon -->
        <input type="password" id="inputPass" autocomplete="new-password" class="w-full border border-slate-200 rounded-xl p-3.5 pr-12 bg-light outline-none focus:border-primary transition" placeholder="••••••••">
        
        <!-- Tombol Ikon Mata -->
        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-primary transition outline-none">
          <i id="ikonMata" class="fas fa-eye"></i>
        </button>
      </div>
    </div>
    
    <button onclick="prosesLogin()" class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-md hover:bg-blue-700 transition">
      Masuk Aplikasi
    </button>
  </div>

  <!-- APLIKASI UTAMA (DASHBOARD) -->
  <div id="main-app" class="mobile-container app-container hidden">
    
    <!-- Top Header -->
    <header class="flex justify-between items-center p-5 pt-8 bg-white sticky top-0 z-10 border-b border-slate-50">
      <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
        <i class="fas fa-wallet text-primary"></i> Dompet Saya
      </h1>
      <div class="flex items-center gap-4">
        <button onclick="renderSettings()" class="text-slate-400 hover:text-primary transition" title="Pengaturan">
          <i class="fas fa-cog text-xl"></i>
        </button>
        <button onclick="prosesLogout()" class="text-slate-400 hover:text-rose-500 transition" title="Keluar">
          <i class="fas fa-sign-out-alt text-xl"></i>
        </button>
      </div>
    </header>

    <main id="app-content" class="px-5 fade-in min-h-screen">
       <!-- Tampilan dirender oleh app.js -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-slate-100 shadow-[0_-4px_20px_rgba(0,0,0,0.02)] px-6 py-3 flex justify-between items-center z-50">
      <button onclick="renderDashboard()" class="nav-btn text-primary flex flex-col items-center gap-1 w-16 transition-colors">
        <i class="fas fa-home text-xl"></i><span class="text-[10px] font-bold">Beranda</span>
      </button>
      <button onclick="pilihTransaksi()" class="bg-primary text-white w-12 h-12 rounded-full shadow-md shadow-blue-200 flex items-center justify-center text-xl hover:scale-105 transition-transform">
        <i class="fas fa-plus"></i>
      </button>
      <button onclick="renderHistory()" class="nav-btn text-slate-400 flex flex-col items-center gap-1 w-16 transition-colors">
        <i class="fas fa-receipt text-xl"></i><span class="text-[10px] font-bold">Riwayat</span>
      </button>
    </nav>
  </div> 
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('Service Worker berhasil didaftarkan:', registration);
          })
          .catch((error) => {
            console.log('Pendaftaran Service Worker gagal:', error);
          });
      });
    }
  </script>

  <script src="app.js"></script>
</body>
</html>

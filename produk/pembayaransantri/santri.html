<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pantauan Pembayaran Santri MADASA</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="description" content="Portal resmi pengecekan status pembayaran Uang Ujian dan Uang Rapor santri MADASA secara online dan real-time.">
  <meta property="og:title" content="Pantauan Pembayaran Santri MADASA">
  <meta property="og:description" content="Portal resmi pengecekan status pembayaran santri MADASA secara online dan real-time.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://semoljeh.github.io/tahun/logo.png"> 

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: { teal: { 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e' } } 
        } 
      }
    }
  </script>
  
  <style>
    body { background-color: #f3f4f6; }
    .mobile-container { max-width: 480px; margin: 0 auto; background-color: #fafaf9; min-height: 100vh; box-shadow: 0 0 50px rgba(0,0,0,0.05); }
    .hide-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="text-gray-800 font-sans antialiased">
  <div class="mobile-container pb-2">

    <header class="bg-gradient-to-r from-teal-700 to-teal-600 text-white p-6 rounded-b-[2rem] shadow-md relative overflow-hidden text-center">
      <div class="relative z-10">
        <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center border border-white/30 mx-auto mb-3 shadow-inner">
          <i class="fas fa-search-dollar text-2xl"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight">Portal Informasi Tagihan</h1>
        <p class="text-xs text-emerald-100 mt-1 opacity-90 mb-4">Cek Status Pembayaran Santri MADASA</p>
        <a href="https://wa.me/?text=https://semoljeh.github.io/tahun/santri.html" target="_blank" class="inline-flex items-center gap-2 bg-[#25D366] hover:bg-green-600 text-white text-[11px] font-bold py-2 px-4 rounded-full transition-colors shadow-sm">
          <i class="fab fa-whatsapp text-base"></i> Bagikan Info Ini
        </a>
      </div>
    </header>

    <div id="loading" class="text-center py-20">
      <p class="text-sm text-gray-500 font-medium">Sedang mengambil data terbaru...</p>
    </div>

    <main id="app-content" class="hidden px-6 pt-6">
      
      <div class="relative mb-3">
        <select id="dynamic-tabs" onchange="renderData(this.value)" class="w-full bg-white border border-gray-100 shadow-sm rounded-2xl px-4 py-3.5 text-sm font-bold text-teal-700 outline-none focus:border-teal-500 cursor-pointer appearance-none transition-all">
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-teal-500">
          <i class="fas fa-chevron-down"></i>
        </div>
      </div>
      
      <div class="relative mb-6">
        <select id="filterKelas" onchange="renderData(tabAktif)" class="w-full bg-white border border-gray-100 shadow-sm rounded-2xl px-4 py-3.5 text-sm font-bold text-gray-700 outline-none focus:border-teal-500 cursor-pointer appearance-none transition-all">
            <option value="semua">-- Tampilkan Semua Kelas --</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
          <i class="fas fa-chevron-down"></i>
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-blue-50 border border-blue-100 p-4 rounded-3xl text-center shadow-sm">
          <p class="text-[10px] text-blue-600 font-bold uppercase tracking-wider mb-1">Sudah Lunas</p>
          <h3 id="stat-lunas" class="text-3xl font-black text-blue-700">0</h3>
        </div>
        <div class="bg-red-50 border border-red-100 p-4 rounded-3xl text-center shadow-sm">
          <p class="text-[10px] text-red-600 font-bold uppercase tracking-wider mb-1">Belum Lunas</p>
          <h3 id="stat-belum" class="text-3xl font-black text-red-700">0</h3>
        </div>
      </div>
	
      <div id="list-santri" class="flex flex-col gap-3"></div>
    </main>

    <footer class="mt-4 pb-2 pt-4 border-t border-gray-200/60 text-center mx-6">
      <div class="w-6 h-6 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-1.5 text-gray-400">
        <i class="fas fa-shield-alt text-[10px]"></i>
      </div>
      <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Biro Keuangan MADASA</p>
      <p class="text-[9px] font-medium text-gray-400 mt-0.5">&copy; 2026 Seluruh hak cipta dilindungi.</p>
    </footer>
	
  </div>

<script>
// GANTI DENGAN URL WEB APP BARU ANDA
const API_URL = 'https://script.google.com/macros/s/AKfycbyXGzYbE94YgBQLoNGBSSuvNz5kGQlzMTrrxfYsIVTLAVoGfFXnIVtH2dggNDm_C5jocw/exec';

let appData = null; 
let tabAktif = null;

window.onload = async () => {
  try {
    const res = await fetch(API_URL); 
    appData = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app-content').classList.remove('hidden');
    
    let unikKelas = [...new Set(appData.santri.map(s => s.kelas).filter(k => k))].sort();
    unikKelas.forEach(k => {
      document.getElementById('filterKelas').insertAdjacentHTML('beforeend', `<option value="${k}">${k}</option>`);
    });
    renderData();
  } catch (e) { document.getElementById('loading').innerHTML = '<p class="text-red-500 font-bold mt-4">Gagal memuat data dari server.</p>'; }
};

function renderData(jenis = null) {
  let settingBiaya = appData.setting || [];
  if (settingBiaya.length === 0) {
    document.getElementById('list-santri').innerHTML = '<p class="text-center text-sm text-gray-500 py-6">Belum ada pengaturan tagihan.</p>';
    return;
  }
  
  let semuaJenis = settingBiaya.map(s => s.jenis);
  tabAktif = (jenis && semuaJenis.includes(jenis)) ? jenis : semuaJenis[0];

  document.getElementById('dynamic-tabs').innerHTML = semuaJenis.map(j => `<option value="${j}" ${tabAktif === j ? 'selected' : ''}>📋 Tagihan: ${j}</option>`).join('');

  let k = document.getElementById('filterKelas').value;
  let santriFilter = k === 'semua' ? appData.santri : appData.santri.filter(s => s.kelas === k);
  let setAktif = settingBiaya.find(s => s.jenis === tabAktif);

  // KUMPULKAN TOTAL PEMBAYARAN DENGAN PENCARIAN GANDA (NIS ATAU NAMA+KELAS)
  let totalBayarPerSantri = {};
  (appData.pembayaran || []).forEach(p => {
    if (p.jenis === tabAktif) {
      let key = "";
      if (p.nis && p.nis !== "") {
        key = p.nis.toString().trim();
      } else {
        key = (p.nama ? p.nama.toString().trim().toLowerCase() : "") + "_" + (p.kelas ? p.kelas.toString().trim().toLowerCase() : "");
      }
      totalBayarPerSantri[key] = (totalBayarPerSantri[key] || 0) + p.nominal;
    }
  });

  let dataS = santriFilter.map(s => {
    let t = 0; let kl = s.kelas.toUpperCase();
    
    if (kl.includes('TK')) t = setAktif.TK; 
    else if (kl.includes('IBT')) t = setAktif.IBT; 
    else if (kl.includes('SANA')) t = setAktif.SANA;
    else t = setAktif.IBT || setAktif.TK || 0;

    let keyNis = s.nis ? s.nis.toString().trim() : "";
    let keyNamaKelas = (s.nama ? s.nama.toString().trim().toLowerCase() : "") + "_" + (s.kelas ? s.kelas.toString().trim().toLowerCase() : "");
    
    let byr = totalBayarPerSantri[keyNis] || totalBayarPerSantri[keyNamaKelas] || 0;
    let sisa = Math.max(0, t - byr); 
    
    let st = 'Belum';
    if (t > 0) { 
      if (byr >= t) st = 'Selesai'; 
      else if (byr > 0) st = 'Nyicil'; 
    } else { 
      if (byr > 0) st = 'Selesai'; 
    }
    
    return { ...s, sisa, st, t, byr };
  }).sort((a,b) => {
    const order = { 'Belum': 1, 'Nyicil': 2, 'Selesai': 3 };
    return order[a.st] - order[b.st];
  });

  document.getElementById('stat-lunas').innerText = dataS.filter(s => s.st === 'Selesai').length;
  document.getElementById('stat-belum').innerText = dataS.filter(s => s.st !== 'Selesai').length;

  if (dataS.length === 0) {
    document.getElementById('list-santri').innerHTML = '<p class="text-center text-sm text-gray-500 py-6">Tidak ada data santri ditemukan.</p>';
  } else {
    document.getElementById('list-santri').innerHTML = dataS.map((s,i) => {
      let badge = '';
      if (s.st === 'Selesai') badge = `<span class="px-3 py-1.5 rounded-xl text-[10px] font-extrabold tracking-wider mb-1 bg-blue-50 text-blue-600 border border-blue-100 shadow-sm"><i class="fas fa-check-circle mr-1"></i>SELESAI</span>`;
      else if (s.st === 'Nyicil') badge = `<span class="px-3 py-1.5 rounded-xl text-[10px] font-extrabold tracking-wider mb-1 bg-amber-50 text-amber-600 border border-amber-100">NYICIL</span>`;
      else badge = `<span class="px-3 py-1.5 rounded-xl text-[10px] font-extrabold tracking-wider mb-1 bg-red-50 text-red-500 border border-red-100">BELUM</span>`;

      let sisaText = (s.st !== 'Selesai' && s.t > 0) ? `<span class="text-[9px] font-bold text-gray-400 mt-1">Kurang Rp ${s.sisa.toLocaleString('id-ID')}</span>` : '';

      return `
      <div class="bg-white p-4 rounded-[20px] shadow-sm border border-gray-100 flex justify-between items-center mb-3 transition-all hover:bg-gray-50">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 min-w-[40px] rounded-full flex items-center justify-center font-bold text-sm bg-gray-50 border border-gray-100 text-gray-500">${i+1}</div>
          <div>
            <h4 class="font-bold text-sm text-gray-800">${s.nama}</h4>
            <p class="text-[10px] text-gray-400 mt-0.5">${s.kelas}</p>
          </div>
        </div>
        <div class="text-right flex flex-col items-end min-w-[85px]">
          ${badge}
          ${sisaText}
        </div>
      </div>
    `}).join('');
  }
}
</script>
</body>
</html>
